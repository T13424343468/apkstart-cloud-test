name: experiment-apkstart-r2

on:
  workflow_dispatch: {}

jobs:
  r2-headless-engine:
    name: 第二轮：ApkStart 引擎口径无头实测（Windows 云端）
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 部署其同口径引擎与镜像（官方源：emulator + Android 14 GPlay x86_64）
        shell: bash
        run: |
          SDK="$RUNNER_TEMP/asdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sL -o clt.zip "https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip"
          unzip -q clt.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/tools"
          SDKMAN="$SDK/cmdline-tools/tools/bin/sdkmanager.bat"
          yes | cmd //c "$SDKMAN" --licenses --sdk_root="$SDK" > /dev/null || true
          cmd //c "$SDKMAN" --sdk_root="$SDK" "emulator" "platform-tools" "system-images;android-34;google_apis_playstore;x86_64" 2>&1 | tail -3
          cmd //c "$SDK/cmdline-tools/tools/bin/avdmanager.bat" create avd -n apkstart_r2 -k "system-images;android-34;google_apis_playstore;x86_64" -d pixel 2>&1 | tail -2
          ls "$SDK/system-images/android-34/google_apis_playstore/x86_64/" | head
          echo "SDKROOT=$SDK" >> "$GITHUB_ENV"

      - name: 无头拉起引擎（-no-window，WHPX 优先，失败回退纯软件）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence-r2 | Out-Null
          $env:ANDROID_SDK_ROOT = $env:SDKROOT
          $env:ANDROID_AVD_HOME = "$env:USERPROFILE\.android\avd"
          $emu = "$env:SDKROOT\emulator\emulator.exe"
          $proc = Start-Process -FilePath $emu -ArgumentList '-avd','apkstart_r2','-no-window','-gpu','swiftshader_indirect','-no-snapshot','-no-audio','-no-boot-anim','-no-metrics','-memory','4096','-cores','2','-accel','whpx' -PassThru -RedirectStandardOutput evidence-r2/20_emu_out.log -RedirectStandardError evidence-r2/20_emu_err.log
          Start-Sleep -Seconds 20
          if ($proc.HasExited) {
            "WHPX 拉起失败(exit=$($proc.ExitCode))，回退纯软件模拟(-accel off)" | Out-File evidence-r2/20_engine.txt
            Get-Content evidence-r2/20_emu_err.log | Out-File evidence-r2/20_engine.txt -Append
            $proc = Start-Process -FilePath $emu -ArgumentList '-avd','apkstart_r2','-no-window','-gpu','swiftshader_indirect','-no-snapshot','-no-audio','-no-boot-anim','-no-metrics','-memory','4096','-cores','2','-accel','off' -PassThru -RedirectStandardOutput evidence-r2/21_emu_out.log -RedirectStandardError evidence-r2/21_emu_err.log
          } else {
            "WHPX 模式模拟器进程存活 pid=$($proc.Id)" | Out-File evidence-r2/20_engine.txt
          }
          Get-Content evidence-r2/20_engine.txt

      - name: adb 连通 + 开机判定 + 装 TaoZip + 截屏 + 界面树
        shell: bash
        run: |
          set -uo pipefail
          ADB="$SDKROOT/platform-tools/adb.exe"
          "$ADB" start-server
          if ! timeout 120 "$ADB" wait-for-device; then echo "RESULT: adb 连不上（无头拉起失败）" | tee evidence-r2/40_result.txt; exit 0; fi
          BOOTED=0
          for i in $(seq 1 120); do
            B=$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$B" = "1" ]; then BOOTED=1; break; fi
            sleep 5
          done
          if [ "$BOOTED" != "1" ]; then echo "RESULT: 600 秒未完成开机（超时）" | tee evidence-r2/40_result.txt; "$ADB" exec-out screencap -p > evidence-r2/41_timeout.png || true; exit 0; fi
          echo "RESULT: 引擎无头开机成功，adb 可连可操控" | tee evidence-r2/40_result.txt
          "$ADB" shell getprop ro.build.version.release >> evidence-r2/40_result.txt
          dotnet workload install android
          dotnet publish ZipGo/ui/TaoZip.UI.Android/TaoZip.UI.Android.csproj -c Release -p:RuntimeIdentifier=android-x64
          APK=$(find ZipGo/ui -name "*-Signed.apk" -not -path "*/obj/*" 2>/dev/null | head -1)
          if [ -n "${APK:-}" ]; then
            "$ADB" install -r "$APK" && echo "TaoZip 安装成功: $APK" >> evidence-r2/40_result.txt
            "$ADB" shell monkey -p com.taozip.app -c android.intent.category.LAUNCHER 1
            sleep 15
            "$ADB" exec-out screencap -p > evidence-r2/50_taozip_screen.png || true
            "$ADB" shell uiautomator dump /sdcard/ui.xml && "$ADB" pull /sdcard/ui.xml evidence-r2/50_ui.xml || true
          else
            echo "APK 构建失败，仅保留引擎层证据" >> evidence-r2/40_result.txt
          fi
          "$ADB" exec-out screencap -p > evidence-r2/51_engine_screen.png || true
          cat evidence-r2/40_result.txt

      - name: 存档证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apkstart-r2-evidence
          path: evidence-r2/
